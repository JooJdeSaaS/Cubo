<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Climatempo Ar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Qualidade do Ar Interior</h1>
        <div class="dashboard">
            <div class="card">
                <h3>PM 2.5</h3>
                <p id="pm25">--</p>
                <span>µg/m³</span>
            </div>
            <div class="card">
                <h3>CO (Monóxido)</h3>
                <p id="co">--</p>
                <span>PPM</span>
            </div>
            <div class="card">
                <h3>Temperatura</h3>
                <p id="temp">--</p>
                <span>°C</span>
            </div>
        </div>
    </div>

    <script>
        async function fetchData() {
            const res = await fetch('http://localhost:5000/data');
            const data = await res.json();
            document.getElementById('temp').innerText = data.temp || '--';
            document.getElementById('pm25').innerText = data.pm25 || '--';
            // Adicione os outros sensores aqui
        }
        setInterval(fetchData, 3000); // Atualiza a cada 3 segundos
    </script>
</body>
</html>
